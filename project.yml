name: EhViewerIOS
options:
  bundleIdPrefix: moe.ehviewer
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  EhViewerIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moe.ehviewer.iosprototype
        PRODUCT_NAME: EhViewerIOS
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  EhViewerIOS:
    build:
      targets:
        EhViewerIOS: all
    run:
      config: Debug
    archive:
      config: Release
